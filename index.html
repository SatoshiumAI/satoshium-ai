<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Satoshium — AI governed by Bitcoin</title>

<style>
/* --- trimmed for brevity: original styles preserved --- */

.hero-signal-btn{
display:inline-flex;
align-items:center;
gap:8px;
padding:10px 16px;
border:1px solid rgba(214,163,74,.28);
border-radius:999px;
background:rgba(214,163,74,.08);
color:#f4c36a;
font-weight:700;
cursor:pointer;
transition:all .18s ease;
margin-top:18px;
}

.hero-signal-btn:hover{
background:rgba(214,163,74,.14);
transform:translateY(-1px);
}

.hero-signal-btn.is-on{
background:rgba(214,163,74,.22);
}
</style>
</head>

<body>

<script src="/assets/js/signal-toggle.js"></script>

<main class="wrap content">

<section class="hero">
<div class="hero-content">

<div class="pill">🪐 Satoshium Universe • Main Platform</div>

<h1>AI, governed by Bitcoin.</h1>

<p>
Satoshium explores how trusted systems, shared knowledge,
and intelligent coordination can evolve together.
</p>

<div class="hero-actions">
<a class="pill pill-link" href="/mentor/">🧭 Start Your Guided Tour →</a>
<a class="pill pill-link" href="/manifesto/">📜 Read the Satoshium Manifesto</a>
</div>

<button id="heroSignalToggle" class="hero-signal-btn">
📡 Enable Signal Layer
</button>

<a href="https://satoshium.net/signal/" class="hero-signal-link">
📡 Signal Layer Live — Participate in infrastructure proposals →
</a>

</div>
</section>

</main>

<div id="footer-container"></div>

<script src="/assets/signal-toggle.js"></script>

<script>
fetch("/components/footer.html")
.then(r => r.text())
.then(html => {
document.getElementById("footer-container").innerHTML = html;

if (window.initSatoshiumSignal) {
window.initSatoshiumSignal();
}

const heroBtn = document.getElementById("heroSignalToggle");

function syncHeroState(){
const footerToggle = document.getElementById("signalToggle");
if(!footerToggle) return;

const isOn = footerToggle.getAttribute("aria-pressed") === "true";

heroBtn.classList.toggle("is-on", isOn);
heroBtn.textContent = isOn
? "📡 Signal Layer Active"
: "📡 Enable Signal Layer";
}

heroBtn.addEventListener("click", () => {
const footerToggle = document.getElementById("signalToggle");
if(footerToggle) footerToggle.click();
setTimeout(syncHeroState, 60);
});

setTimeout(syncHeroState, 160);
});
</script>

</body>
</html>
